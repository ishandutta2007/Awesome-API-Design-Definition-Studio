<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glow-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>

    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
      fill: url(#primary-grad);
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 2.5px;
      fill: #38bdf8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .anim-pulse {
      animation: pulse 6s ease-in-out infinite alternate;
    }
    .anim-float1 {
      animation: floatOne 8s ease-in-out infinite alternate;
    }
    .anim-float2 {
      animation: floatTwo 10s ease-in-out infinite alternate;
    }
    .anim-flow {
      stroke-dasharray: 8 6;
      animation: flowLine 25s linear infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.35; transform: scale(0.95); }
      100% { opacity: 0.7; transform: scale(1.08); }
    }
    @keyframes floatOne {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-16px) rotate(3deg); }
    }
    @keyframes floatTwo {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(18px) rotate(-4deg); }
    }
    @keyframes flowLine {
      to { stroke-dashoffset: -200; }
    }
  </style>

  <!-- Deep canvas background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/>

  <!-- Matrix Grid -->
  <rect width="1200" height="400" fill="url(#grid)" rx="16"/>

  <!-- Dynamic Ambient Glowing Orbs in Background -->
  <g filter="url(#blur-glow)">
    <circle cx="220" cy="120" r="140" fill="url(#glow-cyan)" class="anim-pulse" style="transform-origin: 220px 120px;" />
    <circle cx="980" cy="270" r="160" fill="url(#glow-purple)" class="anim-pulse" style="transform-origin: 980px 270px; animation-delay: -3s;" />
  </g>

  <!-- Animated API Dataflow Lines (Background Layer) -->
  <g opacity="0.45">
    <path class="anim-flow" d="M -50 80 Q 300 20 600 90 T 1250 50" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path class="anim-flow" d="M -50 320 Q 350 370 700 310 T 1250 340" fill="none" stroke="#818cf8" stroke-width="2" style="animation-direction: reverse;"/>
  </g>

  <!-- Dynamic Floating Decorative Cards / Badges (Subtly Animated in Background) -->
  <g class="anim-float1" style="transform-origin: 1040px 100px;" opacity="0.85">
    <rect x="960" y="70" width="165" height="42" rx="8" fill="#1e293b" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>
    <circle cx="982" cy="91" r="5" fill="#38bdf8"/>
    <text x="996" y="96" class="pill-text">OpenAPI 3.1 &amp; 3.0</text>
  </g>

  <g class="anim-float2" style="transform-origin: 990px 160px;" opacity="0.85">
    <rect x="910" y="140" width="180" height="42" rx="8" fill="#1e293b" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1.5"/>
    <circle cx="932" cy="161" r="5" fill="#c084fc"/>
    <text x="946" y="166" class="pill-text">GraphQL &amp; REST</text>
  </g>

  <g class="anim-float1" style="transform-origin: 1010px 230px; animation-delay: -2s;" opacity="0.85">
    <rect x="940" y="210" width="175" height="42" rx="8" fill="#1e293b" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.5"/>
    <circle cx="962" cy="231" r="5" fill="#818cf8"/>
    <text x="976" y="236" class="pill-text">AsyncAPI &amp; Event</text>
  </g>

  <g class="anim-float2" style="transform-origin: 900px 300px; animation-delay: -4s;" opacity="0.85">
    <rect x="860" y="280" width="185" height="42" rx="8" fill="#1e293b" stroke="rgba(52, 211, 153, 0.4)" stroke-width="1.5"/>
    <circle cx="882" cy="301" r="5" fill="#34d399"/>
    <text x="896" y="306" class="pill-text">Mocking &amp; Testing</text>
  </g>

  <!-- High-Contrast Foreground Content (Protected from Dynamic Clutter) -->
  <g id="foreground-content">
    <!-- Category Pill Tag -->
    <rect x="80" y="65" width="235" height="30" rx="15" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
    <text x="96" y="85" class="tagline-text">⚡ CURATED ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="80" y="150" class="title-text">Awesome API Design</text>
    <text x="80" y="202" class="title-text">&amp; Definition Studio</text>

    <!-- Subtitle / Value Proposition -->
    <text x="82" y="250" class="subtitle-text">The definitive guide to visual API editors, OpenAPI specifications,</text>
    <text x="82" y="278" class="subtitle-text">contract testing platforms, mock engines &amp; developer studios.</text>

    <!-- Interactive Badges Row -->
    <g transform="translate(82, 315)">
      <rect x="0" y="0" width="105" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="18" y="21" class="pill-text">🚀 SaaS</text>

      <rect x="115" y="0" width="145" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="130" y="21" class="pill-text">⭐ Open Source</text>

      <rect x="270" y="0" width="135" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="285" y="21" class="pill-text">🛠️ Toolkits</text>

      <rect x="415" y="0" width="135" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="430" y="21" class="pill-text">📖 OpenAPI</text>
    </g>
  </g>
</svg>
